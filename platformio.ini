; STM32H743VIT6 — 网口 MJPEG 视频流
; Keil-compiled baseline works; GCC needs D2 SRAM sections

[env:YS_H7Multi]

platform = ststm32
board = weact_mini_h743vitx
framework = stm32cube

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

board_build.ldscript = custom.ld

build_flags =
    -D USE_HAL_DRIVER
    -D STM32H743xx
    -D HSE_VALUE=25000000
    -D CHECKSUM_BY_HARDWARE
    -I include
    -I lib/lwip/src/include
    -I lib/lwip/src/include/lwip
    -I lib/lwip/src/include/netif
    -I lib/lwip/system
    -I src

build_type = debug
debug_build_flags = -O0 -g3

extra_scripts = pre:exclude_new_eth.py
